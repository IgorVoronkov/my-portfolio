<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Логотип VIN">
  <style>
    :root {
      --color-primary-900: #0B1D3A;
      --color-primary-700: #1F3A63;
      --color-primary-500: #3D5A85;
    }
    .letter { fill: var(--color-primary-900); }
    .flourish { fill: none; stroke: var(--color-primary-700); stroke-width: 2; stroke-linecap: round; }
    .dot { fill: var(--color-primary-500); }
  </style>

  <!-- Левый вензель -->
  <path class="flourish" d="M20,100 C40,60 55,60 65,85 C72,102 60,112 50,100 C43,91 52,84 62,90" />

  <!-- Правый вензель (зеркально) -->
  <path class="flourish" d="M300,100 C280,60 265,60 255,85 C248,102 260,112 270,100 C277,91 268,84 258,90" />

  <!-- V -->
  <path class="letter" d="M95,55 L118,145 L128,145 L151,55 L138,55 L123,120 L108,55 Z" />

  <!-- I (со вставленной точкой-акцентом сверху вместо обычной) -->
  <rect class="letter" x="152" y="70" width="10" height="75" />
  <circle class="dot" cx="157" cy="58" r="5" />

  <!-- N -->
  <path class="letter"
    d="M180,145 L180,55 L191,55 L219,120 L219,55 L230,55 L230,145 L219,145 L191,80 L191,145 Z" />

  <!-- Нижний соединяющий росчерк -->
  <path class="flourish" d="M70,168 C120,185 200,185 250,168" stroke-width="2.5" />
</svg>
